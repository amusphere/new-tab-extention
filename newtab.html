<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新しいタブ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="backgroundContainer" class="background-container"></div>
  <div class="controls">
    <button
      id="reloadButton"
      class="control-button"
      type="button"
      aria-label="背景を更新"
      title="背景を更新"
    >
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.34 5.66" />
        <polyline points="20 7 20 11 16 11" />
      </svg>
    </button>
    <button
      id="pinButton"
      class="control-button"
      type="button"
      aria-pressed="false"
      aria-label="背景を固定"
      title="背景を固定"
    >
      <svg class="icon pin-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 3h10v4l-2 2v5l2 2v1H7v-1l2-2V9L7 7z" />
        <line x1="12" y1="16" x2="12" y2="21" />
      </svg>
    </button>
  </div>
  <div class="container">
    <div class="content">
      <div class="time-display">
        <div id="time" class="time">--:--</div>
        <div id="date" class="date">----年--月--日</div>
      </div>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="検索またはURLを入力..."
          autocomplete="off"
        >
      </div>

      <div class="shortcuts">
        <h2>最近開いたサイト</h2>
        <div id="recentSites" class="shortcuts-grid">
          <!-- 履歴から動的に生成 -->
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
